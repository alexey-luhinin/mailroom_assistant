services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mailroom
      POSTGRES_PASSWORD: mailroom
      POSTGRES_DB: mailroom
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailroom"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Services ──────────────────────────────────────────────────────────────

  mcp-server:
    build: ./services/mcp-server
    ports:
      - "8006:8006"
    env_file: ./config/.env
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - ./config:/app/config
    depends_on:
      redis:
        condition: service_healthy

  sorter:
    build: ./services/sorter
    ports:
      - "8001:8001"
    env_file: ./config/.env
    environment:
      POSTGRES_URL: postgresql://mailroom:mailroom@postgres:5432/mailroom
      REDIS_URL: redis://redis:6379
      MCP_SERVER_URL: http://mcp-server:8006
    volumes:
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_started

  researcher:
    build: ./services/researcher
    ports:
      - "8002:8002"
    env_file: ./config/.env
    environment:
      MCP_SERVER_URL: http://mcp-server:8006
    volumes:
      - ./config:/app/config
    depends_on:
      mcp-server:
        condition: service_started

  briefer:
    build: ./services/briefer
    ports:
      - "8005:8005"
    env_file: ./config/.env
    environment:
      POSTGRES_URL: postgresql://mailroom:mailroom@postgres:5432/mailroom
      REDIS_URL: redis://redis:6379
      MCP_SERVER_URL: http://mcp-server:8006
    volumes:
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_started

  drafter:
    build: ./services/drafter
    ports:
      - "8003:8003"
    env_file: ./config/.env
    environment:
      POSTGRES_URL: postgresql://mailroom:mailroom@postgres:5432/mailroom
      REDIS_URL: redis://redis:6379
      MCP_SERVER_URL: http://mcp-server:8006
    volumes:
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_started

  critic:
    build: ./services/critic
    ports:
      - "8004:8004"
    env_file: ./config/.env
    volumes:
      - ./config:/app/config

  lead-agent:
    build: ./services/lead-agent
    ports:
      - "8000:8000"
    env_file: ./config/.env
    environment:
      POSTGRES_URL: postgresql://mailroom:mailroom@postgres:5432/mailroom
      REDIS_URL: redis://redis:6379
      SORTER_URL: http://sorter:8001
      RESEARCHER_URL: http://researcher:8002
      DRAFTER_URL: http://drafter:8003
      CRITIC_URL: http://critic:8004
      BRIEFER_URL: http://briefer:8005
      MCP_SERVER_URL: http://mcp-server:8006
    volumes:
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sorter:
        condition: service_started
      researcher:
        condition: service_started
      briefer:
        condition: service_started
      drafter:
        condition: service_started
      critic:
        condition: service_started

  unsubscribe:
    build: ./services/unsubscribe
    ports:
      - "8007:8007"
    env_file: ./config/.env
    environment:
      POSTGRES_URL: postgresql://mailroom:mailroom@postgres:5432/mailroom
      MCP_SERVER_URL: http://mcp-server:8006
    volumes:
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_started

  web-ui:
    build: ./services/web-ui
    ports:
      - "3000:3000"
    depends_on:
      lead-agent:
        condition: service_started

volumes:
  postgres_data:
